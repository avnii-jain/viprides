  <g transform="translate(180, 290) scale(0.65)" stroke="#eab308" stroke-width="2.2" opacity="0.25" fill="none">
    <circle cx="30" cy="30" r="24" stroke-dasharray="3 3" />
    <polygon points="30,6 35,25 30,22 25,25" fill="#eab308" />
    <polygon points="30,54 35,35 30,38 25,35" fill="#eab308" />
    <polygon points="6,30 25,25 22,30 25,35" fill="#eab308" />
    <polygon points="54,30 35,25 38,30 35,35" fill="#eab308" />
  </g>

  <!-- Mini Direction Wayfinder arrow (Left Center) -->
  <g transform="translate(75, 135) scale(0.6)" stroke="#1e293b" stroke-width="2.5" opacity="0.16" fill="none">
    <path d="M10 20 L35 10 L60 20 L50 45 L35 35 L20 45 Z" stroke-dasharray="3 3" />
  </g>
</svg>
