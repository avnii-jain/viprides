<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" fill="none">
  <!-- 1. Globe with orbiting plane (Top Left) -->
  <g transform="translate(25, 25) scale(0.85)" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <circle cx="45" cy="45" r="38" />
    <path d="M30 18 C32 28, 42 32, 38 45 C35 55, 42 62, 40 75" />
    <path d="M48 10 C52 22, 65 28, 62 42 C60 52, 68 60, 65 72" />
    <path d="M35 48 C45 46, 52 54, 58 50" />
    <path d="M10 60 C-2 70, 8 82, 32 80 C60 78, 88 64, 88 52" />
    <path d="M78 46 L86 34 L92 36 L88 46 L97 50 L96 54 L86 50 L82 56 L78 55 L80 48 Z" fill="#1e293b" />
  </g>

  <!-- Decorative small clouds & stars around -->
  <g stroke="#eab308" stroke-width="2" opacity="0.25" fill="none">
    <path d="M140 35 Q148 25 158 35 Q168 28 178 35 Q185 45 175 50 L140 50 Z" />
    <path d="M30 155 L32 162 L39 164 L34 168 L35 175 L30 171 L25 175 L26 168 L21 164 L28 162 Z" fill="#eab308" />
    <circle cx="170" cy="180" r="3" fill="#eab308" />
    <circle cx="340" cy="160" r="3" fill="#eab308" />
    <circle cx="20" cy="330" r="3" fill="#eab308" />
  </g>

  <!-- 2. Paper Plane with loop trail (Top Right) -->
  <g transform="translate(210, 20) scale(0.9)" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <path d="M10 20 L85 46 L38 78 Z" fill="none" />
    <path d="M85 46 L52 90 L38 78 L48 56 Z" fill="none" />
    <path d="M48 56 L10 20" />
    <path d="M40 94 C32 108, 50 125, 65 112 C78 100, 62 82, 46 96 C38 104, 44 126, 58 135" stroke-dasharray="4 4" fill="none" />
  </g>

  <!-- 3. Travel Luggage Suitcase (Center) -->
  <g transform="translate(145, 125) scale(0.85)" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <rect x="18" y="24" width="60" height="78" rx="12" fill="none" />
    <path d="M34 24 V12 C34 9, 40 6, 48 6 C56 6, 62 9, 62 12 V24" />
    <rect x="40" y="32" width="16" height="6" rx="3" />
    <line x1="28" y1="24" x2="28" y2="102" />
    <line x1="68" y1="24" x2="68" y2="102" />
    <path d="M78 48 C84 48, 86 52, 86 63 C86 74, 84 78, 78 78" />
    <circle cx="28" cy="108" r="6" fill="#1e293b" />
    <circle cx="68" cy="108" r="6" fill="#1e293b" />
    <circle cx="38" cy="52" r="12" />
    <path d="M34 52 L42 46 L42 58 Z" fill="#1e293b" />
    <rect x="52" y="58" width="16" height="12" rx="3" />
    <polygon points="46,80 48,85 54,85 49,88 51,94 46,90 41,94 43,88 38,85 44,85" fill="#1e293b" />
  </g>

  <!-- 4. Dotted Map Pin Route (Bottom Left) — PROPERLY ORIENTED (Pointers facing down) -->
  <g transform="translate(18, 205) scale(0.95)" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <!-- Left Location Pin (Round head on top, pointing down to ground) -->
    <path d="M20 70 C10 52, 8 45, 8 36 A 12 12 0 1 1 32 36 C32 45, 30 52, 20 70 Z" fill="none" />
    <circle cx="20" cy="36" r="4.5" fill="#1e293b" />

    <!-- Dotted loop trail connecting pins -->
    <path d="M20 70 C45 78, 60 70, 75 52 C88 36, 75 18, 62 25 C48 32, 58 56, 78 48 C95 40, 108 30, 125 42" stroke-dasharray="5 5" fill="none" />

    <!-- Right Location Pin (Round head on top, pointing down to ground) -->
    <path d="M125 42 C115 24, 113 17, 113 8 A 12 12 0 1 1 137 8 C137 17, 135 24, 125 42 Z" fill="none" />
    <circle cx="125" cy="8" r="4.5" fill="#1e293b" />
  </g>

  <!-- 5. World Globe Grid (Bottom Right) -->
  <g transform="translate(230, 220) scale(0.85)" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <circle cx="50" cy="50" r="44" />
    <line x1="6" y1="50" x2="94" y2="50" />
    <line x1="50" y1="6" x2="50" y2="94" />
    <ellipse cx="50" cy="50" rx="24" ry="44" />
    <path d="M12 28 C25 38, 75 38, 88 28" />
    <path d="M12 72 C25 62, 75 62, 88 72" />
  </g>

